schema_version: 1

context:
  name: mashumaro
  version: 3.19

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/mashumaro-${{ version }}.tar.gz
  sha256: 3ef88c23d7a4477092184dace6309da212f115eba9029c89fb93b80ae424692f

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - python >=${{ python_min }}
    - typing_extensions >=4.14.0

tests:
  - python:
      imports:
        - mashumaro
        - mashumaro.core
        - mashumaro.mixins
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Fast serialization framework on top of dataclasses
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/Fatal1ty/mashumaro

extra:
  recipe-maintainers:
    - thewchan
    - maresb
